<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Recommended educational model evaluation workflow</title><desc id="desc">Validate dataset and provenance, define diagnosis target, exclude id and target from features, stratify split, fit preprocessing on training folds, cross validate, freeze decisions and evaluate once on held-out data.</desc><rect width="1200" height="330" rx="20" fill="#f5f8f6"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17443d"><g fill="#fff" stroke="#438878" stroke-width="2"><rect x="20" y="100" width="150" height="95" rx="14"/><rect x="205" y="100" width="150" height="95" rx="14"/><rect x="390" y="100" width="150" height="95" rx="14"/><rect x="575" y="100" width="165" height="95" rx="14"/><rect x="775" y="35" width="165" height="95" rx="14"/><rect x="775" y="190" width="165" height="95" rx="14"/><rect x="980" y="100" width="195" height="95" rx="14"/></g><g font-size="17" font-weight="bold"><text x="95" y="140">Validate data</text><text x="280" y="140">Define target</text><text x="465" y="140">Separate X / y</text><text x="657" y="140">Stratified split</text><text x="857" y="75">Training CV</text><text x="857" y="230">Held-out test</text><text x="1077" y="140">Report results</text></g><g font-size="12"><text x="95" y="163">Schema + source</text><text x="280" y="163">Diagnosis label</text><text x="465" y="163">Exclude id + label</text><text x="657" y="163">Record seed</text><text x="857" y="100">Fit transforms in folds</text><text x="857" y="255">Evaluate once</text><text x="1077" y="163">Metrics + limits</text></g><g stroke="#438878" stroke-width="3" fill="none"><path d="M170 148H205 M355 148H390 M540 148H575 M740 148H755V82H775 M755 148V237H775 M940 82H960V148H980 M940 237H960V148"/></g><text x="600" y="315" font-size="14" font-weight="bold" fill="#9a3d3d">Proposed educational workflow only. It is not clinical validation or a deployed model.</text></g></svg>