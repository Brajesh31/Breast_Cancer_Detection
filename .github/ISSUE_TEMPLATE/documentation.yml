name: "📚 Documentation improvement"
description: Suggest a correction or missing project-specific guide.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, missing, or inaccurate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
